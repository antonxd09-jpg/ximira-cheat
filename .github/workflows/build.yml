name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;23.2.8568313" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Clone third_party
        run: |
          mkdir -p app/third_party
          git clone --depth=1 https://github.com/ocornut/imgui.git app/third_party/imgui
          git clone https://github.com/jmpews/Dobby.git app/third_party/dobby
          git clone --depth=1 https://github.com/nlohmann/json.git app/third_party/nlohmann
          # nlohmann is header-only, needs to be at third_party/nlohmann/nlohmann/json.hpp
          mkdir -p app/third_party/nlohmann/nlohmann
          cp app/third_party/nlohmann/single_include/nlohmann/json.hpp third_party/nlohmann/nlohmann/json.hpp || true


      - name: Patch Dobby ARM64 asm
        run: |
          ASM=app/third_party/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          sed -i 's/@PAGE\b//g; s/@PAGEOFF\b//g' $ASM
      - name: Build APK
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ximira-cheat
          path: app/build/outputs/apk/release/app-release-unsigned.apk
