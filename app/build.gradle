plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ximira.loader'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ximira.loader'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-26'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
